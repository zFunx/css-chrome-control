<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSSSwitch</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="libs/codemirror.min.css">
  <link rel="stylesheet" href="libs/material-darker.min.css">
</head>
<body>
  <header>
    <h1>CSSSwitch</h1>
    <div class="domain-info" id="current-domain">Loading...</div>
  </header>

  <main>
    <div id="snippet-list" class="snippet-list">
      <!-- Snippets will be injected here -->
    </div>

    <div class="empty-state" id="empty-state" style="display: none;">
      <p>No CSS snippets for this domain yet.</p>
    </div>

    <!-- Editor Form (Hidden by default) -->
    <div id="editor-container" class="editor-container hidden">
      <div class="editor-header" style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
        <button id="btn-back" class="icon-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="editor-title" style="margin: 0; font-size: 14px; font-weight: 500; color: var(--primary);">New Snippet</h3>
      </div>
      <div class="editor-wrapper">
        <textarea id="snippet-code" placeholder="body { background: #000 !important; }"></textarea>
        <div class="char-count" id="char-count">0 / 500</div>
      </div>
    </div>
  </main>

  <footer>
    <button id="btn-add-new" class="btn primary full-width">Add New Snippet</button>
    <div class="global-actions">
      <button id="btn-enable-all" class="btn small outline" title="Enable All">Enable All</button>
      <button id="btn-disable-all" class="btn small outline" title="Disable All">Disable All</button>
      <button id="btn-remove-all" class="btn small danger" title="Remove All">Remove All</button>
    </div>
  </footer>

  <script src="libs/codemirror.min.js"></script>
  <script src="libs/css.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
